<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MedSource World letterhead</title>
<style>
@font-face{font-family:"Poppins";font-weight:400;src:url("assets/Poppins-Regular.ttf")}
@font-face{font-family:"Poppins";font-weight:500;src:url("assets/Poppins-Medium.ttf")}
@font-face{font-family:"Poppins";font-weight:700;src:url("assets/Poppins-Bold.ttf")}
:root{
  --forest:#445C44; --green:#7AB537; --leaf:#AFD176; --navy:#033F75; --navydeep:#022A4F;
  --ink:#1B161F; --white:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Poppins",sans-serif;display:flex;flex-direction:column;gap:40px;padding:40px;width:2560px}
.piece{position:relative;width:2480px;background:var(--white);overflow:hidden}
.piece svg.art{position:absolute;left:0;top:0}
.tag{position:absolute;white-space:nowrap;font-weight:500;color:var(--navy)}

/* ---------- Header, first page: 2480 x 500 ---------- */
#h1{height:500px}
#h1 .logo{position:absolute;left:177px;top:186px;height:170px}
#h1 .tag{left:177px;top:350px;font-size:42px;line-height:56px;letter-spacing:.005em}
#h1 .addr{position:absolute;right:177px;top:205px;display:flex;align-items:center;gap:36px}
#h1 .addr .txt{font-size:46px;line-height:66px;font-weight:500;color:var(--navy);text-align:right}
#h1 .addr .txt b{font-weight:700}
#h1 .pin{width:84px;height:84px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- Header, later pages: 2480 x 500, smaller, no address ---------- */
#h2{height:500px}
#h2 .logo{position:absolute;left:177px;top:156px;height:128px}
#h2 .tag{left:177px;top:278px;font-size:32px;line-height:44px}

/* ---------- Footer: 2480 x 250 ---------- */
#f{height:250px}
</style>
</head>
<body>

<!-- FIRST PAGE HEADER -->
<div class="piece" id="h1">
  <svg class="art" width="2480" height="500" viewBox="0 0 2480 500" xmlns="http://www.w3.org/2000/svg">
    <polygon points="2000,0 2480,0 2480,215 2330,70" fill="#AFD176"/>
    <polygon points="1230,92 1520,0 2480,0 2480,150" fill="#7AB537"/>
    <polygon points="1520,0 1900,0 2100,70 1780,40" fill="#4A7F08" opacity=".55"/>
    <polygon points="420,0 1520,0 1230,92 940,148" fill="#033F75"/>
    <polygon points="420,0 880,0 940,148" fill="#022A4F" opacity=".55"/>
    <polygon points="880,0 1100,0 940,148" fill="#445C44" opacity=".0"/>
    <rect x="177" y="438" width="1070" height="11" fill="#033F75"/>
    <rect x="1247" y="438" width="1056" height="11" fill="#7AB537"/>
  </svg>
  <img class="logo" src="assets/medsource-world.svg" alt="MedSource World">
  <div class="tag">Sourcing the Future of Healthcare</div>
  <div class="addr">
    <div class="txt"><b>209 Riverside Drive</b><br>Provident Village<br>Marikina City, Philippines</div>
    <div class="pin">
      <svg width="46" height="46" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    </div>
  </div>
</div>

<!-- LATER PAGES HEADER -->
<div class="piece" id="h2">
  <svg class="art" width="2480" height="500" viewBox="0 0 2480 500" xmlns="http://www.w3.org/2000/svg">
    <polygon points="2100,0 2480,0 2480,150 2360,50" fill="#AFD176"/>
    <polygon points="1300,66 1540,0 2480,0 2480,108" fill="#7AB537"/>
    <polygon points="1540,0 1880,0 2060,50 1800,28" fill="#4A7F08" opacity=".55"/>
    <polygon points="520,0 1540,0 1300,66 1040,106" fill="#033F75"/>
    <polygon points="520,0 940,0 1040,106" fill="#022A4F" opacity=".55"/>
    <rect x="177" y="352" width="1070" height="9" fill="#033F75"/>
    <rect x="1247" y="352" width="1056" height="9" fill="#7AB537"/>
  </svg>
  <img class="logo" src="assets/medsource-world.svg" alt="MedSource World">
  <div class="tag">Sourcing the Future of Healthcare</div>
</div>

<!-- FOOTER -->
<div class="piece" id="f">
  <svg class="art" width="2480" height="250" viewBox="0 0 2480 250" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,250 0,56 1080,250" fill="#033F75"/>
    <polygon points="0,126 0,250 540,250" fill="#022A4F" opacity=".6"/>
    <polygon points="1020,250 1440,160 1730,250" fill="#7AB537"/>
    <polygon points="1440,160 1730,250 1960,250" fill="#AFD176" opacity=".85"/>
    <polygon points="1730,250 1960,250 2480,250 2480,222 2150,250" fill="#445C44" opacity="0"/>
    <rect x="177" y="0" width="0" height="0" fill="none"/>
  </svg>
</div>

</body>
</html>
